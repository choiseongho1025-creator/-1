<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>나의 도우미 설정</title>
<style>
:root{--bg:#f3f1fa;--fg:#22203a;--mut:#6b6885;--card:#fff;--line:#d8d4ea;--acc:#5b47d6}
@media (prefers-color-scheme:dark){:root{--bg:#15131f;--fg:#ecebf6;--mut:#a09db8;--card:#211e30;--line:#36324d;--acc:#9d8dff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Malgun Gothic","Noto Sans KR",system-ui,sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:20px 18px 60px}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:16px;margin:26px 0 8px;color:var(--acc)}
.sub{color:var(--mut);font-size:13px;margin:0 0 6px}
.row{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:14px}
.row>label{flex:0 0 190px}
.row input[type=text],.row select{flex:1;font:inherit;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.row input[type=range]{flex:1;accent-color:var(--acc)}
.row .val{flex:0 0 64px;text-align:right;color:var(--mut);font-size:13px}
.note{font-size:12.5px;color:var(--mut);margin:6px 0}
button{font:inherit;font-size:13px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
button:hover{border-color:var(--acc)}
.slot{display:flex;align-items:center;gap:12px;margin:10px 0;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.slot .pv{width:64px;height:64px;display:flex;align-items:center;justify-content:center;font-size:44px;flex:0 0 64px}
.slot .pv img{width:100%;height:100%;object-fit:contain}
.slot .tx{flex:1;font-size:13px}.slot .tx b{display:block;font-size:14px}
.slot .bt{display:flex;flex-direction:column;gap:6px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>🐱 나의 도우미 설정</h1>
  <p class="sub">캐릭터를 마우스 오른쪽 버튼으로 눌러도 이 창이 열려요. 바뀐 설정은 바로 적용돼요.</p>
  <div id="app"></div>
</main>
<script src="settings.js"></script>
</body>
</html>
